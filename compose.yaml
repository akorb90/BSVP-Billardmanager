services:
  app:
    image: ${BILLARD_IMAGE:-ghcr.io/akorb90/bsvp-billardmanager:latest}
    restart: unless-stopped
    environment:
      APP_ORIGIN: https://${BILLARD_HOST:-localhost}
      DATABASE_URL: postgres://billard@db:5432/billard
      DATABASE_PASSWORD_CONFIG: /run/secrets/app_config
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - billard_data:/data
      - type: bind
        source: ./secrets/config.json
        target: /run/secrets/app_config
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
      - database
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: billard
      POSTGRES_DB: billard
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    # Reuse the existing security configuration; never generate or replace secrets.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        export POSTGRES_PASSWORD="$$(sha256sum /run/secrets/app_config | cut -d ' ' -f1)"
        exec docker-entrypoint.sh postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - type: bind
        source: ./secrets/config.json
        target: /run/secrets/app_config
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD-SHELL, pg_isready -U billard -d billard]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - database
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:443:443"
    environment:
      BILLARD_HOST: ${BILLARD_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  setup:
    image: ${BILLARD_IMAGE:-ghcr.io/akorb90/bsvp-billardmanager:latest}
    profiles: [setup]
    entrypoint: [node, /app/scripts/setup.js]
    working_dir: /setup
    user: "0:0"
    volumes:
      - ./secrets:/setup/secrets
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true
networks:
  backend:
  database:
    internal: true
volumes:
  billard_data:
  postgres_data:
  caddy_data:
  caddy_config:
