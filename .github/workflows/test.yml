name: Verify draft
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check src/server.js
      - run: node --check public/app.js
      - run: node --test
      - run: docker compose --env-file .env.example config --quiet
